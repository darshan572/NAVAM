# alembic.ini — NAVAM project Alembic configuration
# PostgreSQL 16 + PostGIS 3.4 | Async SQLAlchemy 2.0

[alembic]
# Path to migration scripts, relative to this ini file
script_location = migrations

# Template for migration file names
# Example: 20260920_1510_a1b2c3d4_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Truncate slug to this length (avoids absurdly long filenames)
truncate_slug_length = 40

# Version path separator (default is os-dependent)
version_path_separator = os

# The SQLAlchemy connection URL.
# Override via DATABASE_URL environment variable in env.py (preferred).
# This fallback is used only when running `alembic` CLI without env override.
sqlalchemy.url = postgresql+asyncpg://navam:navam_dev_secret@localhost:5432/navam

# ---------------------------------------------------------------------------
# Logging configuration (standard Python logging)
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
