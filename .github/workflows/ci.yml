# =============================================================================
# NAVAM — GitHub Actions CI Pipeline
# Triggered: PR to main, direct push to main
# Jobs: python-checks → frontend-checks → docker-build
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # Python: lint, type-check, migrate, test (API + ML)
  # ===========================================================================
  python-checks:
    name: Python Checks (lint · type · test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: navam_test
          POSTGRES_USER: navam
          POSTGRES_PASSWORD: navam_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv (fast package installer)
        run: pip install uv

      - name: Install API dependencies
        run: uv pip install -r apps/api/requirements.txt --system

      - name: Install ML dependencies
        run: uv pip install -r services/ml/requirements.txt --system

      - name: Lint with ruff
        run: |
          ruff check apps/api/src/ services/ml/ --output-format=github

      - name: Format check with ruff
        run: |
          ruff format --check apps/api/src/ services/ml/

      - name: Type check with pyright
        run: |
          pyright apps/api/src/

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://navam:navam_test@localhost:5432/navam_test

      - name: Run API tests
        run: pytest apps/api/tests/ -v --tb=short --cov=apps/api/src --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://navam:navam_test@localhost:5432/navam_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
          SECRET_KEY: "test-secret-key-for-ci-use-only-minimum-32-chars"
          KEYCLOAK_URL: "http://localhost:8080"
          KEYCLOAK_REALM: "navam"
          KEYCLOAK_CLIENT_ID: "navam-api"
          KEYCLOAK_CLIENT_SECRET: "test-client-secret"
          ML_SERVING_URL: "http://localhost:8001"

      - name: Run ML tests
        run: pytest services/ml/tests/ -v --tb=short --cov=services/ml --cov-report=xml
        env:
          TESTING: "true"
          DATABASE_URL: postgresql+asyncpg://navam:navam_test@localhost:5432/navam_test

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: apps/api/coverage.xml,services/ml/coverage.xml
          flags: python
          fail_ci_if_error: false

  # ===========================================================================
  # Frontend: lint, type-check, build (Next.js / Vite)
  # ===========================================================================
  frontend-checks:
    name: Frontend Checks (lint · type · build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Lint with ESLint
        run: npm run lint
        working-directory: apps/web

      - name: Type check with tsc
        run: npm run type-check
        working-directory: apps/web

      - name: Build production bundle
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "https://navam.example.gov.in/api"
          NEXT_PUBLIC_MARTIN_URL: "https://tiles.navam.example.gov.in"

      - name: Check bundle size
        run: |
          echo "Build artefacts:"
          du -sh apps/web/.next/ 2>/dev/null || du -sh apps/web/dist/ 2>/dev/null || true

  # ===========================================================================
  # Docker: build all images (runs only after both check jobs pass)
  # ===========================================================================
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [python-checks, frontend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: navam-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      - name: Build ML serving image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ml/serving
          file: ./services/ml/serving/Dockerfile
          push: false
          tags: navam-ml:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: navam-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: false
          tags: navam-worker:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
