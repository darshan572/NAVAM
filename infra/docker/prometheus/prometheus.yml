# =============================================================================
# NAVAM — Prometheus Configuration
# Scrapes metrics from all application and infrastructure services
# =============================================================================

global:
  scrape_interval:     15s   # How frequently to scrape targets
  evaluation_interval: 15s   # How frequently to evaluate rules
  scrape_timeout:      10s

  # Attach these labels to all time series collected from this Prometheus
  external_labels:
    cluster: 'navam-dev'
    environment: 'development'

# =============================================================================
# Alerting (uncomment when Alertmanager is added)
# =============================================================================
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# =============================================================================
# Rule files (place alert/recording rules in infra/docker/prometheus/rules/)
# =============================================================================
rule_files:
  # - "rules/api_alerts.yml"
  # - "rules/ml_alerts.yml"
  # - "rules/infra_alerts.yml"

# =============================================================================
# Scrape Configurations
# =============================================================================
scrape_configs:

  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ---------------------------------------------------------------------------
  # NAVAM API (FastAPI + prometheus-fastapi-instrumentator)
  # Exposes: http_requests_total, http_request_duration_seconds, etc.
  # ---------------------------------------------------------------------------
  - job_name: 'navam-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          component: 'backend'
    metrics_path: /metrics
    scrape_interval: 10s

  # ---------------------------------------------------------------------------
  # ML Serving Service
  # ---------------------------------------------------------------------------
  - job_name: 'navam-ml-serving'
    static_configs:
      - targets: ['ml-serving:8001']
        labels:
          service: 'ml-serving'
          component: 'inference'
    metrics_path: /metrics
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # Martin Tile Server
  # Exposes Prometheus metrics at /metrics (built-in)
  # ---------------------------------------------------------------------------
  - job_name: 'navam-martin'
    static_configs:
      - targets: ['martin:3000']
        labels:
          service: 'martin'
          component: 'tiles'
    metrics_path: /metrics
    scrape_interval: 30s

  # ---------------------------------------------------------------------------
  # Keycloak — metrics endpoint (requires KC_METRICS_ENABLED=true)
  # ---------------------------------------------------------------------------
  - job_name: 'keycloak'
    static_configs:
      - targets: ['keycloak:8080']
        labels:
          service: 'keycloak'
          component: 'auth'
    metrics_path: /metrics
    scrape_interval: 30s

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter (future — add postgres-exporter service to compose)
  # Uncomment when postgres_exporter container is deployed
  # ---------------------------------------------------------------------------
